[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.4.0"
description = "OpenAI-compatible gateway with routing, semantic cache, rate limiting and cost accounting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lpogosu" }]
dependencies = [
    "fastapi==0.124.4",
    "uvicorn[standard]==0.33.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "httpx==0.28.1",
    "redis==7.4.0",
    "numpy==2.4.2",
    "PyYAML==6.0.3",
    "prometheus-client==0.26.0",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.41.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==7.0.0",
    "respx==0.23.1",
    "fakeredis[lua]==2.37.1",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
]

[project.urls]
Homepage = "https://github.com/lpogosu/llm-gateway"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return
    "PTH",  # pathlib
    "ASYNC",
    "S",    # bandit
    "T20",  # no print in library code
    "RUF",
]
ignore = [
    "S101",  # asserts are the point in tests
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
