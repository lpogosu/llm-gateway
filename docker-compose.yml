name: llm-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-gateway:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GATEWAY_REDIS_URL: redis://redis:6379/0
      # Ollama runs on the host, not in this stack: it wants the GPU and a model cache
      # measured in tens of gigabytes.
      GATEWAY_OLLAMA_BASE_URL: ${GATEWAY_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GATEWAY_EMBEDDING_BASE_URL: ${GATEWAY_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      GATEWAY_EMBEDDING_MODEL: ${GATEWAY_EMBEDDING_MODEL:-nomic-embed-text}
      GATEWAY_OPENROUTER_API_KEY: ${GATEWAY_OPENROUTER_API_KEY:-}
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-{"sk-local-dev":{"owner":"dev","rate_per_second":5,"burst":20}}}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
    volumes:
      - ./config/routing.yaml:/app/config/routing.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health/ready').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 512mb
      # The cache and the buckets are all reconstructible; evicting the least recently
      # used entry is strictly better than refusing writes when memory fills up.
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  prometheus-data:
  grafana-data:
