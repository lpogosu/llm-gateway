global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: llm-gateway

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: llm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: llm-gateway

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
