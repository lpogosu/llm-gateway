{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- /*
  Rendered only when explicitly asked for. In any real cluster the API keys and the
  OpenRouter token come from a Secret managed outside Helm (External Secrets, sealed
  secrets, Vault) and are referenced through `secrets.existingSecret`, so that
  credentials never live in a values file or in the release history.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway.fullname" . }}-secrets
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_API_KEYS: {{ required "secrets.apiKeys must be set when secrets.create is true" .Values.secrets.apiKeys | quote }}
  {{- if .Values.secrets.openrouterApiKey }}
  GATEWAY_OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  {{- end }}
{{- end }}
