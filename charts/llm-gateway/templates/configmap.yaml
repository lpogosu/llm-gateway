apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-gateway.fullname" . }}-config
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
data:
  GATEWAY_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  GATEWAY_REDIS_URL: {{ .Values.config.redisUrl | quote }}
  GATEWAY_ROUTING_CONFIG_PATH: /etc/llm-gateway/routing.yaml
  GATEWAY_OLLAMA_BASE_URL: {{ .Values.config.ollamaBaseUrl | quote }}
  GATEWAY_OPENROUTER_BASE_URL: {{ .Values.config.openrouterBaseUrl | quote }}
  GATEWAY_EMBEDDING_BASE_URL: {{ .Values.config.embeddingBaseUrl | quote }}
  GATEWAY_EMBEDDING_MODEL: {{ .Values.config.embeddingModel | quote }}
  GATEWAY_CACHE_ENABLED: {{ .Values.config.cacheEnabled | quote }}
  GATEWAY_CACHE_TTL_SECONDS: {{ .Values.config.cacheTtlSeconds | quote }}
  GATEWAY_CACHE_SIMILARITY_THRESHOLD: {{ .Values.config.cacheSimilarityThreshold | quote }}
  GATEWAY_CACHE_MAX_TEMPERATURE: {{ .Values.config.cacheMaxTemperature | quote }}
  GATEWAY_RATE_LIMIT_ENABLED: {{ .Values.config.rateLimitEnabled | quote }}
  GATEWAY_REQUEST_TIMEOUT_SECONDS: {{ .Values.config.requestTimeoutSeconds | quote }}
  GATEWAY_BREAKER_FAILURE_THRESHOLD: {{ .Values.config.breakerFailureThreshold | quote }}
  GATEWAY_BREAKER_RECOVERY_SECONDS: {{ .Values.config.breakerRecoverySeconds | quote }}
  GATEWAY_OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  GATEWAY_OTEL_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-gateway.fullname" . }}-routing
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
data:
  routing.yaml: |
    {{- toYaml .Values.routing | nindent 4 }}
