name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Mypy
        run: mypy --strict app

      - name: Tests
        # The suite uses fakeredis and scripted providers, so no service containers and
        # no network are needed.
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage
        uses: actions/upload-artifact@v4.4.3
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  config:
    name: config validity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: pip install -e "."

      - name: Routing table parses and validates
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.routing.config import load_routing_config
          from app.routing.rules import RoutingTable
          table = RoutingTable(load_routing_config(Path("config/routing.yaml")))
          print("routes:", [route.name for route in table.routes])
          print("advertised models:", table.advertised_models())
          PY

      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Prometheus config and alert rules are valid
        # config/ is mounted at the path compose uses, so the rule_files reference is
        # resolved for real rather than skipped.
        run: |
          docker run --rm -v "$PWD/config:/etc/prometheus" --entrypoint /bin/promtool \
            prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml

  image:
    name: docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3.7.1

      - name: Build
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          push: false
          load: true
          tags: llm-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts and answers its liveness probe
        run: |
          docker run -d --name gateway -p 8080:8080 \
            -e GATEWAY_REDIS_URL=redis://127.0.0.1:6379/0 \
            -e 'GATEWAY_API_KEYS={"sk-ci":{"owner":"ci","rate_per_second":10,"burst":20}}' \
            llm-gateway:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/live >/dev/null; then
              echo "live after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          docker logs gateway
          exit 1

  helm:
    name: helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: azure/setup-helm@v4.2.0
        with:
          version: v3.16.3

      - name: Lint
        run: helm lint charts/llm-gateway

      - name: Render with every optional object enabled
        run: |
          helm template gw charts/llm-gateway \
            --set secrets.create=true \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true > rendered.yaml
          test -s rendered.yaml

      - name: Validate against the Kubernetes schemas
        # ServiceMonitor is a CRD with no published schema, hence -ignore-missing-schemas.
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas rendered.yaml
